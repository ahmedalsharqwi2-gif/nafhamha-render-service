{
  "name": "Nafhamha approved episode production",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "phase": {
          "type": "choice",
          "options": [
            "inspect",
            "voice",
            "render",
            "publish",
            "host-reviewed"
          ],
          "required": true,
          "default": "voice"
        },
        "approved_video_sha256": {
          "type": "string",
          "required": false
        },
        "visual_review_passed": {
          "type": "boolean",
          "default": false,
          "required": false
        },
        "cycle_id": {
          "type": "string",
          "required": true
        },
        "due_at": {
          "type": "string",
          "required": true
        },
        "episode_dir": {
          "type": "string",
          "required": true
        },
        "composition_id": {
          "type": "string",
          "required": true
        }
      }
    }
  },
  "permissions": {
    "contents": "write",
    "actions": "read"
  },
  "concurrency": {
    "group": "nafhamha-production",
    "cancel-in-progress": false
  },
  "jobs": {
    "episode": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 45,
      "env": {
        "GITHUB_TOKEN": "${{ github.token }}",
        "GH_TOKEN": "${{ github.token }}",
        "NAFHAMHA_CYCLE_ID": "${{ inputs.cycle_id }}",
        "NAFHAMHA_DUE_AT": "${{ inputs.due_at }}",
        "NAFHAMHA_API_TOKEN": "${{ secrets.NAFHAMHA_API_TOKEN || secrets.API_TOKEN }}",
        "BUFFER_API_KEY": "${{ secrets.BUFFER_API_KEY }}",
        "APPROVED_VIDEO_SHA256": "${{ inputs.approved_video_sha256 }}",
        "VISUAL_REVIEW_PASSED": "${{ inputs.visual_review_passed }}",
        "NAFHAMHA_EPISODE_DIR": "${{ inputs.episode_dir }}",
        "NAFHAMHA_COMPOSITION_ID": "${{ inputs.composition_id }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "main"
          }
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": 22
          }
        },
        {
          "name": "Verify audio-inspection prerequisite",
          "run": "if ! command -v ffprobe >/dev/null; then\n  sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources\n  sudo timeout 70 apt-get -o Dir::Etc::sourcelist='sources.list.d/ubuntu.sources' -o Dir::Etc::sourceparts='-' -o APT::Get::List-Cleanup=0 -o Acquire::Retries=0 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update -qq\n  sudo timeout 100 apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y --no-install-recommends ffmpeg\nfi",
          "if": "inputs.phase == 'voice' || inputs.phase == 'render'",
          "timeout-minutes": 3
        },
        {
          "name": "Read-only current channel inventory before topic selection",
          "if": "inputs.phase == 'inspect'",
          "run": "node production/episode-runner.mjs inspect"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always() && inputs.phase == 'inspect'",
          "with": {
            "name": "${{ inputs.cycle_id }}-inspection",
            "path": "cycle-output/",
            "retention-days": 30
          }
        },
        {
          "name": "Verify full own-channel inventory and retain one original voice request",
          "run": "node production/episode-runner.mjs voice",
          "if": "inputs.phase == 'voice'"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "id": "voice",
          "if": "always() && inputs.phase == 'voice'",
          "with": {
            "name": "${{ inputs.cycle_id }}-voice",
            "path": "cycle-output/",
            "retention-days": 30,
            "if-no-files-found": "error"
          }
        },
        {
          "name": "Bind exact retained voice artifact to permanent cycle",
          "if": "success() && inputs.phase == 'voice'",
          "env": {
            "VOICE_ARTIFACT_ID": "${{ steps.voice.outputs.artifact-id }}"
          },
          "run": "node production/episode-runner.mjs seal-voice"
        },
        {
          "name": "Restore exact retained original voice for new visual render",
          "if": "inputs.phase == 'render'",
          "run": "node production/episode-runner.mjs prepare-render"
        },
        {
          "name": "Install pinned visual renderer and QA prerequisites",
          "if": "inputs.phase == 'render'",
          "run": "npm ci --no-audit --no-fund\npython -m pip install numpy Pillow\nnpx remotion browser ensure\npython production/fetch-episode-font.py"
        },
        {
          "name": "Render measured full episode without voice regeneration",
          "if": "inputs.phase == 'render'",
          "run": "node production/render-episode.mjs\npython production/finish-episode.py"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "id": "render",
          "if": "always() && inputs.phase == 'render'",
          "with": {
            "name": "${{ inputs.cycle_id }}-render",
            "path": "render/nafhamha-final.mp4\nrender/*.json\nrender/*.jpg",
            "retention-days": 30,
            "if-no-files-found": "error"
          }
        },
        {
          "name": "Retain full-film evidence without scheduling",
          "if": "success() && inputs.phase == 'render'",
          "env": {
            "RENDER_ARTIFACT_ID": "${{ steps.render.outputs.artifact-id }}"
          },
          "run": "node production/episode-runner.mjs seal-render"
        },
        {
          "name": "Host exact complete reviewed film without creating or changing a scheduled post",
          "if": "inputs.phase == 'host-reviewed'",
          "run": "node production/episode-runner.mjs host-reviewed"
        },
        {
          "name": "Publish only exact visually reviewed complete film to authorized channel and time",
          "if": "inputs.phase == 'publish'",
          "run": "node production/episode-runner.mjs publish"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always() && (inputs.phase == 'publish' || inputs.phase == 'host-reviewed')",
          "with": {
            "name": "${{ inputs.cycle_id }}-${{ inputs.phase }}-receipt",
            "path": "publication-output/",
            "retention-days": 90,
            "if-no-files-found": "warn"
          }
        }
      ]
    }
  }
}
